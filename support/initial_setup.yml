# Node bootstrap for the cluster. Lives in terraform/support/ of the k8s_tf repo, with a
# symlink at ~/code/k8s/initial_setup.yml so this invocation works from either path.
# ansible-playbook initial_setup.yml -K -i k8smaster,k8sn1,k8sn2,k8sn3,k8sn4,k8sn5
# Tagged so parts can be run alone, e.g. the GPU path:
# ansible-playbook initial_setup.yml --tags kernel,modules,containerd -i k8sn1,
---
# These hosts are Ubuntu 24.04 LTS (noble), not Debian: k8smaster is a
# workstation-class machine (Raptor Lake-P, Iris Xe) and k8sn1-k8sn5 are identical
# Alder Lake-N mini-PCs. The difference that actually bites is the kernel/iGPU pair,
# which is what the HWE kernel task below is for.
- name: Prepare Ubuntu 24.04 (noble) systems for Kubernetes with kubeadm
  hosts: all
  become: yes

  vars:
    # Minor version of the pkgs.k8s.io repo. Must match the cluster: the control plane runs
    # v1.35 and kubelet/kubectl are on v1.35.8, so v1.35 is the only repo a rebuild should
    # pull from. The v1.33 line this used to pin is stale and would install 1.33 binaries.
    kubernetes_version: v1.35

    # Held after install (see the hold task below) so that only a deliberate upgrade can move
    # them. containerd is deliberately absent: it is a runtime, and pinning it would block
    # security fixes.
    kubernetes_packages:
      - kubelet
      - kubeadm
      - kubectl

    # The API server is reached by name, never by address. kubeadm derives the serving
    # certificate's SANs from whatever address the node holds at the moment the cert is
    # generated, so an IP-based endpoint stops verifying as soon as DHCP moves that node --
    # which is exactly what broke the cluster when k8smaster moved .74 -> .76. The name
    # below resolves through the internal zone and never moves; the IP is declared only so
    # that a client configured with an address instead of the name can still verify.
    control_plane_endpoint: k8smaster:6443
    control_plane_ip: 192.168.0.76 # must match the k8smaster DHCP reservation

    # Ubuntu 24.04's GA kernels (6.8.x) ship an i915 driver whose device table does not
    # list the PCI ID of the Alder Lake-N iGPU in the k8sn1-k8sn5 mini-PCs (8086:46d4 --
    # 6.8.x only knows 46D0/46D1/46D2). With no matching ID the driver never probes the
    # device, /dev/dri is never created, and the GPU is invisible to the kubelet and to
    # pods -- `lsmod` still shows i915 loaded, which is why this looks like a module
    # problem but is not one. No 6.8.x point release fixes it (verified: 6.8.0-142 still
    # lacks 46D4); the HWE kernel (7.0.x) has 46D3/46D4 and binds correctly.
    # Hosts deliberately left on the GA kernel. k8smaster's Iris Xe (8086:a7a0) is supported
    # by 6.8, and as the control plane it should only take a kernel jump when someone means
    # it -- not at its next reboot on the back of a GPU fix it does not need.
    hwe_kernel_exclude:
      - k8smaster
    install_hwe_kernel: true
    hwe_kernel_packages:
      - linux-generic-hwe-24.04

    # Modules the cluster needs at boot: CNI/kube-proxy (overlay, br_netfilter), Longhorn
    # (dm_thin_pool, nvme-tcp, dm_crypt, iscsi_tcp) and the NFS client/server behind the
    # RWX volumes and backup jobs. The last two are the hardware watchdog: the mini-PCs
    # expose the PCH TCO through iTCO_wdt, while k8smaster's BIOS instead publishes an ACPI
    # WDAT table that owns the TCO, so it needs wdat_wdt. Each module loads harmlessly where
    # its hardware is absent, and whichever one binds creates /dev/watchdog for systemd.
    kernel_modules:
      - overlay
      - br_netfilter
      - dm_thin_pool
      - nvme-tcp
      - dm_crypt
      - iscsi_tcp
      - nfs
      - nfsd
      - iTCO_wdt
      - wdat_wdt

  tasks:

    - name: Stop and disable AppArmor
      systemd:
        name: apparmor
        state: stopped
        enabled: no

    - name: Stop and disable multipathd
      systemd:
        name: multipathd
        state: stopped
        enabled: no

    - name: Remove swap line
      lineinfile:
        path: /etc/fstab
        regexp: '^.*swap.*'
        state: absent

    - name: Disable swap
      command: swapoff -a

    - name: Allow all users to run sudo without a password
      copy:
        dest: /etc/sudoers.d/nopasswd
        content: "%sudo ALL=(ALL) NOPASSWD:ALL\n"
        mode: '0660'  # Ensures the file has the appropriate permissions


    # One list (kernel_modules) drives both the immediate modprobe and the boot config. The
    # previous version kept two hard-coded lists that had already drifted -- nfs/nfsd were
    # modprobed but never persisted -- and it appended to /etc/modules, which Ubuntu 24.04
    # itself marks obsolete in favour of /etc/modules-load.d/.
    - name: Load required kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop: "{{ kernel_modules }}"
      tags: modules

    - name: Persist required kernel modules for boot
      copy:
        dest: /etc/modules-load.d/kubernetes.conf
        mode: '0644'
        content: |
          # Managed by initial_setup.yml -- modules Kubernetes and the storage stack
          # need loaded on every boot.
          {% for module in kernel_modules %}
          {{ module }}
          {% endfor %}
      tags: modules

    # Drop the same modules from the obsolete file so there is only one place that decides
    # what loads at boot.
    - name: Remove the obsolete /etc/modules entries
      lineinfile:
        path: /etc/modules
        line: "{{ item }}"
        state: absent
      loop: "{{ kernel_modules }}"
      tags: modules


    # The NMI/soft-lockup detectors only *report* a wedged CPU; they never reset the board.
    # This arms the real hardware watchdog instead -- iTCO_wdt on the mini-PCs, wdat_wdt on
    # k8smaster (ACPI WDAT) -- which systemd pets from PID 1. If the kernel stops scheduling,
    # the PCH/ACPI timer resets the box on its own, turning a silent freeze into an automatic
    # reboot: unlike a hand power-cycle, that reboot lands in the journal and in pstore, which
    # is the only way to see what a frozen k8sn2 was doing. RuntimeWatchdogSec is the device
    # timeout; systemd pets it at half that interval.
    - name: Ensure the systemd manager drop-in directory exists
      file:
        path: /etc/systemd/system.conf.d
        state: directory
        mode: '0755'
      tags: watchdog

    - name: Enable the systemd hardware watchdog
      copy:
        dest: /etc/systemd/system.conf.d/watchdog.conf
        mode: '0644'
        content: |
          [Manager]
          RuntimeWatchdogSec=30s
          ShutdownWatchdogSec=5min
      register: watchdog_conf
      tags: watchdog

    # systemd-modules-load runs in sysinit -- after PID1 has already tried to open
    # /dev/watchdog -- and systemd does not retry, so on a fresh boot the device has to
    # exist before the manager starts. Neither box ships these modules in its initramfs, so
    # pull them in; without this the watchdog only arms on a daemon-reexec, not on boot.
    - name: Include the watchdog modules in the initramfs
      lineinfile:
        path: /etc/initramfs-tools/modules
        line: "{{ item }}"
        create: yes
      loop:
        - iTCO_wdt
        - wdat_wdt
      register: initramfs_modules
      tags: watchdog

    - name: Rebuild the initramfs so the watchdog binds before systemd starts
      command: update-initramfs -u
      when: initramfs_modules.changed
      changed_when: true
      tags: watchdog

    # daemon-reexec reloads the manager's config (RuntimeWatchdogSec) and opens /dev/watchdog
    # without a reboot. Gated so it only fires when the drop-in actually changed.
    - name: Apply the watchdog to the running manager
      command: systemctl daemon-reexec
      when: watchdog_conf.changed
      changed_when: true
      tags: watchdog

    # A detected hard lockup otherwise just prints to a console nobody reads. Escalate it to a
    # panic so the existing kernel.panic=10 reboot fires and pstore keeps the trace.
    # softlockup_panic is deliberately left off: it is false-positive prone on a loaded node.
    - name: Panic on a detected hard lockup so the reboot captures it
      sysctl:
        name: kernel.hardlockup_panic
        value: 1
        state: present
        reload: yes
      tags: watchdog

    # Say out loud whether the device actually showed up, so a --check run or a fleet rollout
    # shows which nodes would (not) get a working watchdog.
    - name: Report the systemd watchdog timeout
      command: systemctl show -p RuntimeWatchdogUSec --value
      changed_when: false
      check_mode: false
      register: watchdog_state
      tags: watchdog

    - name: Check for the watchdog device
      stat:
        path: /dev/watchdog
      register: watchdog_dev
      tags: watchdog

    - name: Report the watchdog state
      debug:
        msg: >-
          /dev/watchdog {{ 'present' if watchdog_dev.stat.exists else 'MISSING' }};
          systemd RuntimeWatchdogUSec={{ watchdog_state.stdout }}
      tags: watchdog


    # ---------------------------------------------------------------------------------------
    # pstore: capture a kernel panic into firmware NVRAM so it survives the reboot. On panic
    # the kernel dumps dmesg into an EFI variable (dump-type0-*); on the next boot
    # systemd-pstore archives it to /var/lib/systemd/pstore and clears the raw variable.
    # efi_pstore is auto-loaded and systemd-pstore ships enabled on Ubuntu, but neither is
    # guaranteed on a rebuilt node, so both are pinned here. The reporter then turns whatever
    # is on disk into a node-exporter textfile metric (see the prometheus module's
    # collector.textfile.directory) plus a journal line, so a panic that killed the box is
    # still visible on the way back up. Nothing here needs a reboot.
    # ---------------------------------------------------------------------------------------
    - name: Ensure the pstore backend loads at boot
      copy:
        dest: /etc/modules-load.d/pstore.conf
        mode: '0644'
        content: |
          # Managed by initial_setup.yml -- efi_pstore saves a panic's dmesg to an EFI
          # variable so it outlives the crash. Archived on boot by systemd-pstore.service.
          efi_pstore
      tags: pstore

    - name: Load the pstore backend now
      modprobe:
        name: efi_pstore
        state: present
      tags: pstore

    - name: Configure pstore archival
      file:
        path: /etc/systemd/pstore.conf.d
        state: directory
        mode: '0755'
      tags: pstore

    - name: Move pstore records off the firmware variable and into /var
      copy:
        dest: /etc/systemd/pstore.conf.d/report.conf
        mode: '0644'
        content: |
          # Managed by initial_setup.yml -- move records to /var/lib/systemd/pstore and
          # delete the raw EFI variable so the firmware's variable store never fills up.
          [PStore]
          Storage=external
          Unlink=yes
      tags: pstore

    - name: Archive pstore records on boot
      systemd:
        name: systemd-pstore.service
        enabled: yes
      tags: pstore

    - name: Create the node-exporter textfile directory
      file:
        path: /var/lib/node_exporter/textfile
        state: directory
        mode: '0755'
      tags: pstore

    - name: Install the pstore reporter
      copy:
        dest: /usr/local/sbin/pstore-report
        mode: '0755'
        content: |
          #!/bin/bash
          # Managed by initial_setup.yml. Turn captured pstore records into a node-exporter
          # textfile metric plus a journal line, so a panic that killed the box is visible.
          set -u
          DIR=/var/lib/systemd/pstore
          RAW=/sys/fs/pstore
          OUTDIR=/var/lib/node_exporter/textfile
          OUT="$OUTDIR/pstore.prom"
          mkdir -p "$OUTDIR"
          files=$(find "$DIR" "$RAW" -maxdepth 1 -type f 2>/dev/null | sort)
          count=$(printf '%s\n' "$files" | grep -c .)
          newest=$(find "$DIR" "$RAW" -maxdepth 1 -type f -printf '%T@\n' 2>/dev/null | sort -n | tail -1)
          [ -n "$newest" ] || newest=0
          tmp=$(mktemp "$OUTDIR/.pstore.XXXXXX")
          {
            echo '# HELP node_pstore_records pstore crash records present on this node'
            echo '# TYPE node_pstore_records gauge'
            echo "node_pstore_records $count"
            echo '# HELP node_pstore_newest_mtime_seconds mtime of the newest pstore record'
            echo '# TYPE node_pstore_newest_mtime_seconds gauge'
            echo "node_pstore_newest_mtime_seconds $newest"
          } > "$tmp"
          chmod 0644 "$tmp"
          mv "$tmp" "$OUT"
          if [ "$count" -gt 0 ]; then
            logger -t pstore-report "captured $count pstore record(s)"
            grep -hiE 'panic|oops|BUG:|Call Trace|RIP:' $files 2>/dev/null | tail -20 | while read -r l; do
              logger -t pstore-report "  $l"
            done
          fi
      tags: pstore

    - name: Report pstore records at boot
      copy:
        dest: /etc/systemd/system/pstore-report.service
        mode: '0644'
        content: |
          [Unit]
          Description=Report captured pstore crash records
          After=systemd-pstore.service
          Wants=systemd-pstore.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/pstore-report

          [Install]
          WantedBy=multi-user.target
      register: pstore_report_unit
      tags: pstore

    - name: Refresh the pstore metric daily
      copy:
        dest: /etc/systemd/system/pstore-report.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Daily refresh of the pstore metric

          [Timer]
          OnBootSec=10min
          OnUnitActiveSec=1d
          Persistent=true

          [Install]
          WantedBy=timers.target
      register: pstore_report_timer
      tags: pstore

    - name: Reload systemd for the pstore units
      systemd:
        daemon_reload: yes
      when: pstore_report_unit.changed or pstore_report_timer.changed
      tags: pstore

    - name: Enable the pstore reporter
      systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
      loop:
        - pstore-report.service
        - pstore-report.timer
      tags: pstore


    - name: Enable IP forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: 1
        state: present
        reload: yes

    - name: Enable huge pages
      sysctl:
        name: vm.nr_hugepages
        value: 2048
        state: present
        reload: yes


    - name: Enable bridge-nf for iptables
      sysctl:
        name: "{{ item }}"
        value: 1
        state: present
        reload: yes
      loop:
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables


    - name: Update and upgrade apt system packages
      apt:
        update_cache: yes
        upgrade: dist

    # Ubuntu 24.04 points fresh installs at the GA kernel (6.8.x), which cannot drive the
    # mini-PCs' iGPU -- see the install_hwe_kernel comment for the evidence. The HWE
    # meta-package puts the node on the supported 7.0.x track: it pulls linux-image,
    # linux-modules and linux-headers 7.0.x, and because 7.0.x always sorts newer than
    # 6.8.x, GRUB's default entry stays on it across later apt/unattended upgrades (so
    # linux-generic itself does not have to be removed).
    - name: Install the HWE kernel for iGPU support
      apt:
        name: "{{ hwe_kernel_packages }}"
        state: present
        # Needed so this task stands on its own under --tags kernel, where the
        # untagged "Update and upgrade apt system packages" task above is skipped.
        update_cache: yes
      when: install_hwe_kernel | bool and inventory_hostname not in hwe_kernel_exclude
      tags: [kernel, gpu]

    # A staged kernel only takes effect on reboot, and a rebuild that stops here comes back
    # with no graphics support -- silently, since i915 loads either way. Say so loudly
    # rather than leave the next person to rediscover it.
    # check_mode: false so this still reports the real kernel during a --check run;
    # the command is read-only, so running it is harmless.
    - name: Check which kernel is running
      command: uname -r
      changed_when: false
      check_mode: false
      register: running_kernel
      tags: [kernel, gpu]

    - name: Warn when the running kernel is not the HWE kernel
      debug:
        msg: >-
          Running kernel {{ running_kernel.stdout }} is not on the HWE 7.0.x track, so this
          node's iGPU has no driver and /dev/dri will not exist. Reboot to pick up
          {{ hwe_kernel_packages | join(', ') }}, then re-run this play to confirm.
      when:
        - install_hwe_kernel | bool
        - inventory_hostname not in hwe_kernel_exclude
        - running_kernel.stdout | length > 0
        - not running_kernel.stdout.startswith('7.')
      tags: [kernel, gpu]

    - name: Check for the iGPU render node
      stat:
        path: /dev/dri/renderD128
      register: dri_render_node
      tags: [kernel, gpu]

    - name: Warn when the iGPU driver did not bind
      debug:
        msg: >-
          /dev/dri/renderD128 is missing, so the graphics driver did not bind. Check
          `lspci -nnk -s 00:02.0` (expect "Kernel driver in use: i915") and
          `dmesg | grep i915` before scheduling GPU work on this node.
      when: not dri_render_node.stat.exists
      tags: [kernel, gpu]

    - name: Add Kubernetes apt key
      apt_key:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key"

    - name: Add Kubernetes apt repository
      apt_repository:
        repo: "deb https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/ /"
        filename: kubernetes

    - name: Install system packages
      apt:
        name:
          - vim
          - apt-transport-https
          - ca-certificates
          - curl
          - sudo
          - nfs-common
          - smartmontools
        state: latest


    - name: Install k8s packages
      apt:
        name: "{{ ['containerd'] + kubernetes_packages }}"

    # Pinned straight after install so only a deliberate upgrade can move them: unhold
    # kubeadm, install the newer kubeadm, `kubeadm upgrade apply`, re-hold -- then per node
    # unhold/install/re-hold kubelet+kubectl and restart kubelet, one node at a time.
    # Without the holds the packages drift apart, which is exactly how kubelet reached 1.35.8
    # while kubeadm sat held at 1.35.6 and the control plane could never follow.
    - name: Hold the Kubernetes packages against uncontrolled upgrades
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ kubernetes_packages }}"

    - name: Ensure /var/lib/longhorn exists
      file:
        path: /var/lib/longhorn
        state: directory

    - name: Ensure containerd configuration directory exists
      file:
        path: /etc/containerd
        state: directory

    - name: Generate default containerd configuration
      command: containerd config default
      register: containerd_config
      changed_when: false

    - name: Write containerd configuration to /etc/containerd/config.toml
      copy:
        content: "{{ containerd_config.stdout }}"
        dest: /etc/containerd/config.toml
        mode: '0644'
        force: no

    - name: Set SystemdCgroup to true in containerd configuration
      replace:
        path: /etc/containerd/config.toml
        regexp: '(.*SystemdCgroup = .*)false'
        replace: '\1true'

    # containerd's CRI plugin creates an fsnotify watcher for the CNI config directory, and
    # when the per-UID inotify instance limit is exhausted it fails to load *entirely*
    # ("failed to create fsnotify watcher: too many open files"), which leaves the node
    # NotReady with kubelet unable to start pods. Ubuntu's default of 128 is low for a busy
    # host: k8smaster was already at 142 instances, so its containerd did not come back
    # after a plain restart until this was raised. Harmless where unused, so set everywhere.
    - name: Raise the inotify instance limit for containerd and kubelet
      sysctl:
        name: fs.inotify.max_user_instances
        value: 8192
        state: present
        reload: yes
      tags: containerd

    # Device plugins that inject devices through CDI (the Intel GPU plugin behind
    # gpu.intel.com/i915, and NVIDIA's CDI path) are silently useless while this is false:
    # the scheduler hands out the resource, but the device files never appear in the
    # container. containerd 2.x generates enable_cdi = false in its default config, so this
    # flips the key that "containerd config default" always writes.
    - name: Enable CDI in containerd so device plugins can inject devices
      lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^(\s*)enable_cdi\s*=.*'
        line: '\1enable_cdi = true'
        backrefs: yes
      register: containerd_cdi
      tags: containerd

    - name: Restart containerd after changing the CDI setting
      systemd:
        name: containerd
        state: restarted
      when: containerd_cdi.changed
      tags: containerd

    - name: Ensure containerd is restarted
      systemd:
        name: containerd
        state: restarted


    - name: Ensure containerd is started and enabled
      systemd:
        name: containerd
        state: started
        enabled: yes

    - name: Copy CA certificate from localhost to target
      copy:
        src: ~/.ssl/ca.crt  # Directly specify the local path
        dest: /usr/local/share/ca-certificates/ca.crt  # Destination path on the target
      register: copy_result

    - name: Update CA certificates if copy was successful
      command: update-ca-certificates
      when: copy_result.changed

    - name: Allow other users in s3fs
      ansible.builtin.lineinfile:
        path: /etc/fuse.conf
        regexp: '^#?user_allow_other'
        line: 'user_allow_other'

    # Reproduces the control plane's identity on a rebuild instead of letting it default to
    # whichever address the node happens to hold. Pass with `kubeadm init --config`, and use
    # it for `kubeadm init phase certs` whenever a cert has to be regenerated.
    #
    # Two things here are load-bearing and were learned the hard way:
    #
    # 1. certSANs accepts only IP addresses and DNS names -- kubeadm rejects a CIDR
    #    ("altname is not a valid IP address, DNS label...") -- so the DHCP lease can never be
    #    covered by a subnet. That is why the endpoint is a name and the IP is listed
    #    explicitly: components that dial the address instead of the name (notably the
    #    kubelet's webhook authorizer, which posts SubjectAccessReviews to the node IP) fail
    #    x509 verification without it, which breaks `kubectl exec`/port-forward.
    # 2. localAPIEndpoint.advertiseAddress and the etcd serverCertSANs/peerCertSANs are what
    #    put the node IP into the apiserver and etcd serving certs. Note `kubeadm certs renew`
    #    re-signs with the EXISTING SANs and cannot add one, so after a node IP change the
    #    certs must be regenerated with `kubeadm init phase certs ...` instead.
    - name: Write the kubeadm ClusterConfiguration
      copy:
        dest: /etc/kubernetes/kubeadm-config.yaml
        mode: '0600'
        content: |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: InitConfiguration
          localAPIEndpoint:
            advertiseAddress: {{ control_plane_ip }}
            bindPort: 6443
          ---
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: ClusterConfiguration
          certificatesDir: /etc/kubernetes/pki
          imageRepository: registry.k8s.io
          controlPlaneEndpoint: {{ control_plane_endpoint }}
          apiServer:
            certSANs:
              - k8smaster
              - {{ control_plane_ip }}
          networking:
            dnsDomain: cluster.local
            podSubnet: 10.244.0.0/16
            serviceSubnet: 10.96.0.0/12
          etcd:
            local:
              dataDir: /var/lib/etcd
              serverCertSANs:
                - k8smaster
                - localhost
                - {{ control_plane_ip }}
                - 127.0.0.1
                - "::1"
              peerCertSANs:
                - k8smaster
                - localhost
                - {{ control_plane_ip }}
                - 127.0.0.1
                - "::1"


# kubeadm token create --print-join-command
